<aside class="sidebar" id="sidebar" aria-label="项目和会话">
    <div class="sidebar-header">
        <div class="mode-toggle-container" id="modeToggleContainer">
            <button class="mode-menu-trigger" id="modeMenuTrigger" type="button" aria-haspopup="menu" aria-expanded="false"><span id="modeMenuLabel">FarSide</span><span class="ui-icon" data-ui-icon="chevron" aria-hidden="true"></span></button>
            <div class="mode-menu" id="modeMenu" role="menu" aria-label="选择模式" hidden>
                <button class="mode-toggle-tab active" data-value="work" id="modeWorkTab" type="button" role="menuitemradio" aria-checked="true"><span><strong>FarSide</strong><small>构建、调试和执行任务</small></span><span class="ui-icon" data-ui-icon="check" aria-hidden="true"></span></button>
                <button class="mode-toggle-tab" data-value="chat" id="modeChatTab" type="button" role="menuitemradio" aria-checked="false"><span><strong>MoonYa</strong><small>普通聊天</small></span><span class="ui-icon" data-ui-icon="check" aria-hidden="true"></span></button>
            </div>
            <input type="hidden" id="modeSelect" value="work">
        </div>
        <button class="sidebar-search-button" id="sidebarSearchBtn" type="button" data-tooltip="搜索项目和会话" aria-label="搜索项目和会话" aria-haspopup="dialog" aria-controls="workspaceSearchDialog" aria-expanded="false"><span class="ui-icon" data-ui-icon="search" aria-hidden="true"></span></button>
        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="收起侧边栏"><span class="ui-icon" data-ui-icon="sidebar" aria-hidden="true"></span></button>
    </div>
    <div class="sidebar-menu">
        <button class="new-session-btn" id="sidebarNewChatBtn" type="button"><span class="new-session-left"><span class="ui-icon" data-ui-icon="new-chat" aria-hidden="true"></span><span class="new-session-text">新聊天</span></span><span class="new-session-shortcut">Ctrl K</span></button>
        <div class="model-select-container" id="modelSelectContainer" hidden>
            <div class="custom-model-select"><div class="model-select-value" id="modelSelectValue">DeepSeek</div><span class="model-select-arrow ui-icon" data-ui-icon="chevron" aria-hidden="true"></span><div class="model-select-dropdown"><div class="model-option selected" data-value="deepseek"><div class="model-option-name">DeepSeek</div></div></div></div>
            <input type="hidden" id="modelSelect" value="deepseek">
        </div>
        <div id="workSidebar" class="work-sidebar" hidden>
            <div id="workspaceTree" class="workspace-tree" aria-label="项目与会话"></div>
        </div>
        <div id="recentChatBtn" class="menu-item" role="button" tabindex="0"><div class="menu-item-main"><span>最近</span></div><span class="menu-arrow ui-icon" id="recentChatArrow" data-ui-icon="chevron-right" aria-hidden="true"></span></div>
        <div id="recentChatList" class="recent-chat-list"></div>
    </div>
</aside>
<dialog id="workspaceSearchDialog" class="workspace-search-dialog" aria-label="搜索聊天">
    <input id="workspaceSearch" class="workspace-search-input" type="search" placeholder="搜索聊天" aria-label="搜索聊天" autocomplete="off" spellcheck="false">
    <div id="workspaceSearchResults" class="workspace-search-results" aria-live="polite"></div>
    <div class="workspace-search-heading">快捷操作</div>
    <div class="workspace-search-actions">
        <button id="searchNewChat" class="workspace-search-item" type="button"><span class="ui-icon" data-ui-icon="new-chat" aria-hidden="true"></span><span class="workspace-search-title">新聊天</span><kbd>Ctrl+N</kbd></button>
        <button id="searchOpenFolder" class="workspace-search-item" type="button"><span class="workspace-search-folder" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6V4a1.5 1.5 0 0 1 1.5-1.5H6l1.5 1.5H12a1.5 1.5 0 0 1 1.5 1.5V6M3.3 6h10.2a1 1 0 0 1 1 1.3l-1.3 4a1.5 1.5 0 0 1-1.4 1H3a1 1 0 0 1-1-1.3l1.3-4Z"/></svg></span><span class="workspace-search-title">打开文件夹</span><kbd>Ctrl+O</kbd></button>
        <button id="searchFiles" class="workspace-search-item" type="button"><span class="ui-icon" data-ui-icon="search" aria-hidden="true"></span><span class="workspace-search-title">搜索文件</span><kbd>Ctrl+P</kbd></button>
    </div>
</dialog>
