            <!-- 登录注册弹窗 -->
            <div id="authOverlay" class="auth-overlay">
                <div class="auth-modal liquid-glass" id="authModalBox">
                    <div class="modal-glow" id="modalGlow"></div>
                    <button class="auth-close-btn" id="authCloseBtn" type="button" aria-label="关闭登录"><span class="ui-icon" data-ui-icon="close" aria-hidden="true"></span></button>
                    
                    <div class="auth-modal-left">
                        <div class="image-wrapper">
                            <img src="/image/bg.png" alt="background">
                            <div class="image-overlay"></div>
                        </div>
                        <div class="left-content">
                            <h2>MoonYa</h2>
                            <p>极简美学，温润通透</p>
                        </div>
                    </div>
                    
                    <div class="auth-modal-right">
                        <div class="auth-tabs">
                            <button class="auth-tab-btn active" data-tab="code">验证码登录</button>
                            <button class="auth-tab-btn" data-tab="password">密码登录</button>
                            <button class="auth-tab-btn" data-tab="register">注册账号</button>
                        </div>
                        <div class="auth-form-container">
                            <form class="auth-form" id="password-form">
                                <div class="input-group">
                                    <label>账号</label>
                                    <input type="text" id="loginAccount" placeholder="请输入用户名或邮箱">
                                </div>
                                <div class="input-group">
                                    <label>密码</label>
                                    <input type="password" id="loginPassword" placeholder="请输入密码">
                                </div>
                                <button type="button" class="auth-btn-primary" id="loginBtn">登录</button>
                            </form>

                            <form class="auth-form active" id="code-form">
                                <div class="input-group">
                                    <label for="codeLoginQQ">QQ 号</label>
                                    <input type="text" id="codeLoginQQ" placeholder="请输入 QQ 号" inputmode="numeric" maxlength="11" autocomplete="username" required>
                                </div>
                                <div class="input-group">
                                    <label for="codeLoginCode">验证码</label>
                                    <div class="auth-code-row">
                                        <input type="text" id="codeLoginCode" placeholder="6 位验证码" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
                                        <button type="button" class="auth-send-code" id="loginSendCodeBtn">发送验证码</button>
                                    </div>
                                    <small>验证码发送至 QQ号@qq.com，有效期 5 分钟</small>
                                </div>
                                <button type="button" class="auth-btn-primary" id="codeLoginBtn">登录</button>
                            </form>
                            <form class="auth-form" id="register-form">
                                <div class="input-group">
                                    <label for="registerUsername">QQ 号</label>
                                    <input type="text" id="registerUsername" placeholder="请输入 QQ 号" inputmode="numeric" maxlength="11" autocomplete="username" required>
                                </div>
                                <div class="input-group">
                                    <label for="registerCode">验证码</label>
                                    <div class="auth-code-row">
                                        <input type="text" id="registerCode" placeholder="6 位验证码" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
                                        <button type="button" class="auth-send-code" id="registerSendCodeBtn">发送验证码</button>
                                    </div>
                                    <small>验证码发送至 QQ号@qq.com，有效期 5 分钟</small>
                                </div>
                                <button type="button" class="auth-btn-primary" id="registerBtn">注册</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
