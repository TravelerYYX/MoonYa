SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1
<FilesMatch "^(\.env.*|config\.php|agent_config\.php|composer\.(json|lock)|server-manifest\.json)$">
    Require all denied
</FilesMatch>
<DirectoryMatch "^/var/www/html/(Services|vendor|sql|skills|config)(/|$)">
    Require all denied
</DirectoryMatch>
<DirectoryMatch "(/uploads/program-updates)(/|$)">
    Require all denied
</DirectoryMatch>
