[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "moonya-agent-runtime-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled dsh CLI runtime for the MoonYa Agent Runtime Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]

[project.urls]
Homepage = "https://github.com/deepseek-ai/moonya-agent-runtime"
Documentation = "https://github.com/deepseek-ai/moonya-agent-runtime/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/deepseek-ai/moonya-agent-runtime/issues"
Source = "https://github.com/deepseek-ai/moonya-agent-runtime"

[project.scripts]
dsh = "deepseek_harness_runtime:main"

# Include the injected dsh executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = ["src/deepseek_harness_runtime/runtime/moonya-agent-runtime-sdk-runtime-*"]
exclude = ["src/deepseek_harness_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_harness_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
