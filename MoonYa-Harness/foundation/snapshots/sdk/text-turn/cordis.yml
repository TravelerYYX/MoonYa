# TypeScript SDK snapshot-record patch over `dsh --profile sdk`.

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@moonya/harness-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@moonya/harness-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@moonya/harness-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@moonya/harness-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

- id: session-log-deepseek
  name: '@moonya/harness-session-log-deepseek'
  config:
    enabled: true

- insert:
    - id: snapshot-message-feedback
      name: '@moonya/harness-message-feedback'
      disabled: !!js "process.env.DSH_SNAPSHOT_FEEDBACK !== '1'"
      config:
        maxNoteBytes: 1024
    - id: snapshot-feedback-producer
      name: './feedback-producer.mjs'
      disabled: !!js "process.env.DSH_SNAPSHOT_FEEDBACK !== '1'"
